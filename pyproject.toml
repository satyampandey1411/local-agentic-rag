[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agentic-rag"
version = "0.1.0"
description = "Local agentic RAG chatbot for any PDF — hybrid retrieval, reranking, a bounded verify-and-retry agent, cited answers, runs on a free Colab T4"
requires-python = ">=3.10"
readme = "README.md"
# License: to be decided before any public release (note: PyMuPDF is AGPL-3.0).

# torch and numpy are intentionally NOT pinned: Colab pre-installs matched
# CUDA builds and re-installing them breaks the runtime.
dependencies = [
    "pymupdf>=1.24",              # PDF parsing, tables, OCR hook
    "sentence-transformers>=3.0", # BGE embedder + cross-encoder reranker
    "numpy>=1.26",
    "requests>=2.31",             # Ollama HTTP client
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
colab = [
    "gradio>=5",                  # chat UI (Colab preinstalls gradio 6.x; do not downgrade)
    "nbformat>=5.9",
]
web = [
    "fastapi>=0.110",             # document library web app (python -m local_agentic_rag.server)
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",    # streaming multipart upload parser
]
llamacpp = [
    "llama-cpp-python>=0.3",      # in-process GGUF backend (CPU dev / no server)
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "reportlab>=4.0",   # synthetic PDF generation in tests
    "nbformat>=5.9",
]

[project.scripts]
local-rag-bench = "local_agentic_rag.bench:main"
local-rag-server = "local_agentic_rag.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_agentic_rag = ["server/static/*"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (require actual model files)",
    "unit: marks tests as pure unit tests (no model files required)",
]
