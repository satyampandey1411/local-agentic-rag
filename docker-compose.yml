# One-command install:  docker compose up --build
# Needs Docker with the NVIDIA Container Toolkit for GPU use (see docs/DEPLOY.md).
# The app is published on 127.0.0.1 only. Put TLS and authentication in front of it before
# exposing it to a network.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: downloads the model into the ollama volume, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:7b-instruct"]

  app:
    build: .
    image: local-agentic-rag:latest
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      LOCAL_RAG_OLLAMA_HOST: ollama:11434
      LOCAL_RAG_MODEL: qwen2.5:7b-instruct
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rag-data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-models:
  rag-data:
